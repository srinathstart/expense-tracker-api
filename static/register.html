<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Expense Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; margin-bottom: 24px; color: #1a1a2e; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    input:focus { border-color: #4f46e5; }
    button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4338ca; }
    .msg { margin-top: 14px; text-align: center; font-size: 14px; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .link { text-align: center; margin-top: 16px; font-size: 14px; color: #555; }
    .link a { color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" />
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" />
    <button onclick="register()">Register</button>
    <div class="msg" id="msg"></div>
    <div class="link">Already have an account? <a href="login.html">Login</a></div>
  </div>

  <script>
    const API = "http://localhost:8000";

    async function register() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!username || !password) {
        msg.className = "msg error";
        msg.textContent = "Please fill in all fields.";
        return;
      }

      try {
        const res = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          msg.className = "msg success";
          msg.textContent = "Registered successfully! Redirecting to login...";
          setTimeout(() => window.location.href = "login.html", 1500);
        } else {
          msg.className = "msg error";
          msg.textContent = data.detail || "Registration failed.";
        }
      } catch {
        msg.className = "msg error";
        msg.textContent = "Could not connect to server.";
      }
    }
  </script>
</body>
</html>
